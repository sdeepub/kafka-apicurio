services:
  # 1. Apache Kafka Broker (Dual-Listener Configuration)
  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"   # Exposed to your host computer for Python scripts
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      # 1. Declare two separate entry listeners: INTERNAL and EXTERNAL
      - KAFKA_LISTENERS=INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      # 2. Tell Kafka how to advertise each network address correctly
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-broker:9094,EXTERNAL://localhost:9092
      # 3. Map the protocols to standard PLAINTEXT security
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  # 2. Apicurio Registry Backend (v3.3.1)
  apicurio-registry:
    image: apicurio/apicurio-registry:3.3.1
    container_name: apicurio-registry
    ports:
      - "8080:8080"

  # 3. Apicurio Registry Web UI Console (v3.3.1)
  apicurio-registry-ui:
    image: apicurio/apicurio-registry-ui:3.3.1
    container_name: apicurio-registry-ui
    ports:
      - "8888:8080"
    environment:
      - REGISTRY_API_URL=http://localhost:8080/apis/registry/v3
    depends_on:
      - apicurio-registry

  # 4. Kafbat UI Dashboard (Points to the INTERNAL Kafka doorway on port 9094)
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9000:8080"
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      # Point to the specialized internal network doorway:
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-broker:9094
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://apicurio-registry:8080/apis/ccompat/v7
    depends_on:
      - kafka-broker
      - apicurio-registry

  # 5. Flink JobManager (Master Controller)
  flink-jobmanager:
    image: flink:1.18-scala_2.12
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - ./flink-sql-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar
      - ./flink-sql-avro-confluent-registry-1.18.1.jar:/opt/flink/lib/flink-sql-avro-confluent-registry-1.18.1.jar
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager

  # 6. Flink TaskManager (Worker Node)
  flink-taskmanager:
    image: flink:1.18-scala_2.12
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    volumes:
      - ./flink-sql-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar
      - ./flink-sql-avro-confluent-registry-1.18.1.jar:/opt/flink/lib/flink-sql-avro-confluent-registry-1.18.1.jar
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
