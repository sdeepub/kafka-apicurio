version: '3.8'

services:
  # 1. Apache Kafka Broker (KRaft Mode - Fixed Quorum & Dual Listeners)
  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"   # Exposed to host computer for local Python scripts
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 # 👈 Fixed: Swapped to loopback interface for KRaft internal controller checks
      - KAFKA_LISTENERS=INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-broker:9094,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  # 2. Apicurio Registry Backend (v3.3.1)
  apicurio-registry:
    image: apicurio/apicurio-registry:3.3.1
    container_name: apicurio-registry
    ports:
      - "8080:8080" # Local scripts hit http://localhost:8080/apis/registry/v3
    environment:
      - APICURIO_REGISTRY_STORAGE_KIND=mem # Efficient in-memory mode for development

  # 3. Apicurio Registry Web UI Console (v3.3.1)
  apicurio-registry-ui:
    image: apicurio/apicurio-registry-ui:3.3.1
    container_name: apicurio-registry-ui
    ports:
      - "8888:8080"
    environment:
      - REGISTRY_API_URL=http://localhost:8080/apis/registry/v3 # Navigated cleanly via host browser loopbacks
    depends_on:
      - apicurio-registry

  # 4. Kafbat UI Dashboard (Points to INTERNAL Kafka interface on port 9094)
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9000:8080"
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-broker:9094
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://apicurio-registry:8080/apis/ccompat/v7
    depends_on:
      - kafka-broker
      - apicurio-registry

  # 5. Flink JobManager (Master Controller)
  flink-jobmanager:
    image: flink:1.18-scala_2.12
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints

  # 6. Flink TaskManager (Worker Node)
  flink-taskmanager:
    image: flink:1.18-scala_2.12
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints

  # 7. 🌟 NEW: Apache IoTDB Standalone (Columnar Industrial Time-Series Warehouse)
  iotdb:
    image: apache/iotdb:1.3.3-standalone
    container_name: iotdb
    ports:
      - "6667:6667"     # Native RPC client access doorway
      - "18080:18080"   # HTTP REST layout api management portal
    environment:
      - CONFIG_NAME=docker
      - enable_rest_service=true
      - rest_service_port=18080
    volumes:
      - iotdb_data:/iotdb/data
      - iotdb_logs:/iotdb/logs
      - ./iotdb-conf/iotdb-system.properties:/iotdb/conf/iotdb-system.properties:ro

  # 8. 🌟 NEW: Local Visual Analytics Panel (Grafana with Auto-Installed IoTDB Plugin)
  local-grafana:
    image: grafana/grafana:11.0.0
    container_name: local-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=apache-iotdb-datasource # Automatically installs the official IoTDB data source engine on boot
    depends_on:
      - iotdb

volumes:
  iotdb_data:
  iotdb_logs:
  flink_checkpoints:
  flink_savepoints:
